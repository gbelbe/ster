name: DCO

# Developer Certificate of Origin: every commit in a PR must be signed off
# (`git commit -s` → "Signed-off-by: Name <email>"). Enforced on the PUBLIC
# repo, where external contributions arrive; internal PRs are exempt.
on:
  pull_request:
    branches: ["main", "master"]

jobs:
  dco:
    if: github.repository == 'gbelbe/ster'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Signed-off-by on every PR commit
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for sha in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$sha" \
                 | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "All commits must be signed off under the Developer Certificate"
            echo "of Origin. Re-commit with: git commit -s   (or: git rebase --signoff)."
            exit 1
          fi
          echo "DCO: OK — all commits are signed off."
