name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Jobs run in parallel; 'test' is the only matrix job ───────────────────────

jobs:

  # ── 1. Static checks via prek ────────────────────────────────────────────────
  # One job drives ruff (lint+format, incl. S security rules + C90 complexity),
  # mypy, import-linter and file hygiene through prek + .pre-commit-config.yaml
  # — the exact hooks developers run locally, so CI can never drift from local.
  # The complexity ratchet is a separate job below: it needs the PR base ref for
  # diff-awareness, so it is skipped here.
  checks:
    name: Static checks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Pinned tools from uv.lock back the `uv run` hook entries, so prek uses
      # identical versions in CI and locally — never an independently-pinned
      # hook version that could drift.
      - name: Install deps
        run: uv sync --extra dev

      - name: prek — lint, format, types, security, imports, hygiene
        run: SKIP=complexity-ratchet uvx prek run --all-files

  # ── 1b. JavaScript lint & syntax ─────────────────────────────────────────────
  js:
    name: Lint JS (eslint + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install JS dev deps
        run: npm ci

      - name: eslint — lint browser assets
        run: npx eslint .

      - name: node --check — syntax of every browser .js
        run: |
          for f in ster/assets/*.js kai-extension/*.js; do
            echo "checking $f"; node --check "$f";
          done

  # ── 1c. Complexity ratchet (diff-aware) ──────────────────────────────────────
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    # Diff-aware: only meaningful against a PR's base branch.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # need the base branch to compare complexity against

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Complexity ratchet — no function may grow worse past 10
        run: uv run python scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

  # ── 2. pip-audit (dependency CVEs) ──────────────────────────────────────────
  # Kept as its own job (not in the prek 'checks' job) so a CVE advisory failure
  # is easy to spot and doesn't block the faster lint/type feedback.
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: pip-audit — dependency CVEs
        run: uv run pip-audit --skip-editable

  # ── 4. Tests + coverage ──────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # diff-cover compares changed lines against the base branch

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node lets the JS-validating tests (node --check on graph_app.js) run
      # instead of skipping.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install deps
        run: uv sync --extra dev

      - name: Run tests with coverage
        # -n auto: parallel across the runner's cores (safe now that SPARQL
        # parsing is serialised — sparql_query._SPARQL_LOCK).
        # COVERAGE_CORE=sysmon uses Python 3.12+'s low-overhead sys.monitoring
        # backend; 3.11 has no sysmon, so it uses the C tracer.
        env:
          COVERAGE_CORE: ${{ matrix.python-version == '3.11' && 'ctrace' || 'sysmon' }}
        run: uv run pytest --tb=short -q -n auto --cov=ster --cov-report=xml --cov-report=term-missing

      - name: Patch coverage — changed lines must be ≥ 90% covered
        # Diff-aware: only on PRs, once (latest Python).
        # The interactive curses layer (viewer.py / ai_model_picker.py) is driven by
        # terminal I/O that unit tests can't exercise, so it is excluded from the
        # patch-coverage gate — the 90% floor still applies to every other module.
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: >
          uv run diff-cover coverage.xml
          --compare-branch "origin/${{ github.base_ref }}"
          --fail-under 90
          --exclude '*/nav/viewer.py' '*/nav/ai_model_picker.py'

      - name: Upload coverage to Codecov
        # Upload only once (latest Python) to avoid duplicate reports
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI if Codecov is unreachable
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 5. Publish to PyPI ───────────────────────────────────────────────────────
  # Runs only on pushes to master (not PRs) after all checks pass.
  # Skips automatically if the version in pyproject.toml is already on PyPI.
  # Uses PyPI trusted publishing (OIDC) — no token stored in GitHub secrets.
  #
  # One-time setup required on PyPI:
  #   pypi.org → ster project → Publishing → Add a new publisher
  #     Publisher:      GitHub Actions
  #     Owner:          gbelbe
  #     Repository:     ster
  #     Workflow name:  ci.yml
  #     Environment:    (leave blank)
  publish:
    name: Publish to PyPI
    needs: [checks, js, security, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: write   # required to create GitHub releases and tags

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history needed for --generate-notes

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Check whether this version is already published
        id: check
        run: |
          LOCAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REMOTE=$(curl -sf https://pypi.org/pypi/ster/json \
            | python -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" \
            || echo "0.0.0")
          echo "local=$LOCAL"
          echo "remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check.outputs.publish == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.12.4

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
