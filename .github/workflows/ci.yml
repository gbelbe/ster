name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Jobs run in parallel; 'test' is the only matrix job ───────────────────────

jobs:

  # ── 1. Static checks via prek ────────────────────────────────────────────────
  # One job drives ruff (lint+format, incl. S security rules),
  # mypy, import-linter and file hygiene through prek + .pre-commit-config.yaml
  # — the exact hooks developers run locally, so CI can never drift from local.
  # The complexity ratchet is a separate job below: it needs the PR base ref for
  # diff-awareness, so it is skipped here.
  checks:
    name: Static checks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Pinned tools from uv.lock back the `uv run` hook entries, so prek uses
      # identical versions in CI and locally — never an independently-pinned
      # hook version that could drift.
      - name: Install deps
        run: uv sync --extra dev

      - name: prek — lint, format, types, security, imports, hygiene
        run: SKIP=complexity-ratchet,complexity-ratchet-semanticdiff uvx prek run --all-files

  # ── 1b. JavaScript lint & syntax ─────────────────────────────────────────────
  js:
    name: Lint JS (eslint + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install JS dev deps
        run: npm ci

      - name: eslint — lint browser assets
        run: npx eslint .

      - name: node --check — syntax of every browser .js
        run: |
          for f in ster/assets/*.js kai-extension/*.js; do
            echo "checking $f"; node --check "$f";
          done

  # ── 1c. Complexity ratchet (diff-aware) ──────────────────────────────────────
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    # Diff-aware: only meaningful against a PR's base branch.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # need the base branch to compare complexity against

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Complexity ratchet — no function may grow worse past 15
        run: uv run python scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

      # The ratchet scans one directory per run, so the second shipped package
      # needs its own invocation. tests/test_package_registration.py enforces it.
      - name: Complexity ratchet (semanticdiff)
        run: uv run python scripts/check_complexity_ratchet.py --path semanticdiff --base "origin/${{ github.base_ref }}"

  # ── 2. pip-audit (dependency CVEs) ──────────────────────────────────────────
  # Kept as its own job (not in the prek 'checks' job) so a CVE advisory failure
  # is easy to spot and doesn't block the faster lint/type feedback.
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: pip-audit — dependency CVEs
        run: uv run pip-audit --skip-editable

  # ── 4. Tests + coverage ──────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node lets the JS-validating tests (node --check on graph_app.js) run
      # instead of skipping.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"

      - name: Install deps
        run: uv sync --extra dev

      - name: Run tests with coverage
        # -n auto: parallel across the runner's cores (safe now that SPARQL
        # parsing is serialised — sparql_query._SPARQL_LOCK).
        # COVERAGE_CORE=sysmon uses Python 3.12+'s low-overhead sys.monitoring
        # backend — every version in the matrix has it.
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest --tb=short -q -n auto --cov=ster --cov=semanticdiff --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml

      - name: 📤 Archive coverage reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.xml
            pytest-report.xml

      - name: Patch coverage — changed lines must be ≥ 90% covered
        # Diff-aware: only on PRs, once (latest Python).
        # The 90% floor applies to every module — the curses-era exclusions
        # (viewer.py / ai_model_picker.py) went away with those files.
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: >
          uv run diff-cover coverage.xml
          --compare-branch "origin/${{ github.base_ref }}"
          --fail-under 90

      - name: Upload coverage to Codecov
        # Upload only once (latest Python) to avoid duplicate reports
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI if Codecov is unreachable
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4b. SonarQube Scan ───────────────────────────────────────────────────────
  # Runs after tests are complete to collect coverage reports.
  #
  # The self-hosted runners belong to the internal adeo org. The public mirror
  # (gbelbe/ster) has none registered, so without the repository guard this job
  # queues until GitHub kills it at the 24h ceiling and reds the whole run.
  sonar:
    name: "📡 Code Quality: Sonar push"
    needs: [test]
    if: github.repository == 'adeo/kai-ster'
    runs-on: [self-hosted, Linux, standard]
    # Fail in minutes, not a day, if no self-hosted runner picks this up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: ⚙️ Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: 🛠️ Install project
        run: uv sync --extra dev

      - name: 📥 Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: .

      - name: "📡 Code Quality: Sonar push"
        uses: adeo/sonarqube--scan-action@84f845bcd23f3fff451d91b91a910af2c941d60c # v2.5.0

  # ── 5. Create the GitHub Release for a fresh tag ────────────────────────────
  # release-tag.yml already tagged this commit if it earned a release. Creating
  # the GitHub Release from that tag is what triggers publish.yml — the sole
  # path to PyPI since "ci: let the commit log decide the version" (#156): a
  # routine merge tags but does not publish; publishing needs this Release (or
  # a manual dispatch of publish.yml).
  release:
    name: Create GitHub release
    needs: [checks, js, security, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write   # required to create GitHub releases

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # full history needed for --generate-notes and for the tag

      - name: Create the release if this commit is freshly tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(git describe --tags --exact-match --match 'v*' 2>/dev/null)" || {
            echo "HEAD is not on a release tag — nothing to release this run." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Release skipped::HEAD is not on a release tag."
            exit 0
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release skipped::$TAG already has a GitHub release."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
          echo "::notice title=Release created::$TAG (triggers publish.yml)."
