name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Jobs run in parallel; 'test' is the only matrix job ───────────────────────

jobs:

  # ── 1. Lint & format ────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      # Use the project's pinned ruff (from uv.lock) — not `uv tool install ruff`
      # (always-latest) — so CI and local scripts/ci.sh can never drift apart.
      - name: Install deps
        run: uv sync --extra dev

      - name: ruff — check rules
        run: uv run ruff check .

      - name: ruff — check formatting
        run: uv run ruff format --check .

  # ── 1b. JavaScript lint & syntax ─────────────────────────────────────────────
  js:
    name: Lint JS (eslint + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS dev deps
        run: npm ci

      - name: eslint — lint browser assets
        run: npx eslint .

      - name: node --check — syntax of every browser .js
        run: |
          for f in ster/assets/*.js kai-extension/*.js; do
            echo "checking $f"; node --check "$f";
          done

  # ── 2. Static type checking ──────────────────────────────────────────────────
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --extra dev

      - name: mypy
        run: uv run mypy ster/

  # ── 3. Security ──────────────────────────────────────────────────────────────
  security:
    name: Security (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install deps
        run: uv sync --extra dev

      - name: bandit — static analysis
        run: uv run bandit -r ster/ -c pyproject.toml

      - name: pip-audit — dependency CVEs
        # CVE-2026-3219 / CVE-2026-6357 affect pip itself; not a ster dependency
        run: uv run pip-audit --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --skip-editable

  # ── 4. Tests + coverage ──────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # diff-cover compares changed lines against the base branch

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node lets the JS-validating tests (node --check on graph_app.js) run
      # instead of skipping.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: uv sync --extra dev

      - name: Run tests with coverage
        run: uv run pytest --tb=short -q --cov=ster --cov-report=xml --cov-report=term-missing

      - name: Patch coverage — changed lines must be ≥ 90% covered
        # Diff-aware: only on PRs, once (latest Python).
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch "origin/${{ github.base_ref }}" --fail-under 90

      - name: Upload coverage to Codecov
        # Upload only once (latest Python) to avoid duplicate reports
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI if Codecov is unreachable
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 5. Publish to PyPI ───────────────────────────────────────────────────────
  # Runs only on pushes to master (not PRs) after all checks pass.
  # Skips automatically if the version in pyproject.toml is already on PyPI.
  # Uses PyPI trusted publishing (OIDC) — no token stored in GitHub secrets.
  #
  # One-time setup required on PyPI:
  #   pypi.org → ster project → Publishing → Add a new publisher
  #     Publisher:      GitHub Actions
  #     Owner:          gbelbe
  #     Repository:     ster
  #     Workflow name:  ci.yml
  #     Environment:    (leave blank)
  publish:
    name: Publish to PyPI
    needs: [lint, js, typecheck, security, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC trusted publishing
      contents: write   # required to create GitHub releases and tags

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for --generate-notes

      - uses: astral-sh/setup-uv@v5

      - name: Check whether this version is already published
        id: check
        run: |
          LOCAL=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          REMOTE=$(curl -sf https://pypi.org/pypi/ster/json \
            | python -c "import sys,json; print(json.load(sys.stdin)['info']['version'])" \
            || echo "0.0.0")
          echo "local=$LOCAL"
          echo "remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"
            echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.check.outputs.publish == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes
