name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  # Backstop for the TUI-tier path-filter in the 'changes' job below: a PR
  # that skips the tui tier is validated again here regardless, so a wrong
  # skip decision can't go unnoticed just because main stays quiet between
  # merges. Not a pull_request event, so 'changes' runs the full suite.
  schedule:
    - cron: "0 3 * * *"

# Cancel any in-progress run for the same branch / PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── Jobs run in parallel; 'test' is the only matrix job ───────────────────────

jobs:

  # ── 1. Static checks via prek ────────────────────────────────────────────────
  # One job drives ruff (lint+format, incl. S security rules),
  # mypy, import-linter and file hygiene through prek + .pre-commit-config.yaml
  # — the exact hooks developers run locally, so CI can never drift from local.
  # The complexity ratchet is a separate job below: it needs the PR base ref for
  # diff-awareness, so it is skipped here.
  checks:
    name: Static checks (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      # Pinned tools from uv.lock back the `uv run` hook entries, so prek uses
      # identical versions in CI and locally — never an independently-pinned
      # hook version that could drift.
      - name: Install deps
        run: uv sync --extra dev

      - name: prek — lint, format, types, security, imports, hygiene
        run: SKIP=complexity-ratchet,tidy-ratchet uvx prek run --all-files

  # ── 1b. JavaScript lint & syntax ─────────────────────────────────────────────
  js:
    name: Lint JS (eslint + node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install JS dev deps
        # Deliberately not `npm ci`. Dependabot resolves through a private
        # registry and writes those hosts into package-lock.json; runners have no
        # credentials for it, and npm ci then fails the *whole* install with a
        # 401 rather than skipping one entry — which is how a cytoscape bump
        # turned this job red on main and on every branch cut from it.
        #
        # package.json is a manifest of record here, not a build input: ster has
        # no bundler and the browser libraries are fetched from a CDN at first
        # use. Resolving fresh from the public registry is all eslint needs, and
        # tests/unit/test_browser_dependencies.py still fails if the lockfile
        # points somewhere CI cannot reach.
        run: npm install --no-package-lock --no-audit --no-fund

      - name: npm audit — high and critical dependency CVEs
        run: npm audit --audit-level=high

      - name: eslint — lint browser assets
        run: npx eslint .

      - name: node --check — syntax of every browser .js
        run: |
          for f in ster/assets/*.js kai-extension/*.js; do
            echo "checking $f"; node --check "$f";
          done

  # ── 1c. Complexity ratchet (diff-aware) ──────────────────────────────────────
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    # Diff-aware: only meaningful against a PR's base branch.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the base branch to compare complexity against

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: Complexity ratchet — no function may grow worse past 15
        run: uv run python scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

  # ── 1d. Tidy First ratchet (diff-aware) ──────────────────────────────────────
  # Text-only check on commit messages — no deps to install, no build. Kept as
  # its own job (not folded into 'checks') for the same reason as complexity:
  # it needs the PR base ref, which the 'checks' job's --all-files run has no
  # way to supply.
  tidy:
    name: Tidy First ratchet
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # need the base branch and full commit history

      - name: "Tidy First ratchet: a tidy(<type>) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"

  # Mechanical companion to the ratchet above: for the 8 catalog heuristics
  # craftCov can detect (scripts/craftcov.py --list-detectors), a touched
  # .py file's total across them must go down (or stay at 0) vs. where the
  # branch diverged from main. See CRAFTSMANSHIP.md's "Refactor First".
  refactor-first:
    name: Refactor First gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: "Refactor First: touched files' detectable-heuristic total must go down (or stay 0)"
        run: uv run python3 scripts/check_refactor_first.py --base "origin/${{ github.base_ref }}"

  # ── 2. pip-audit (dependency CVEs) ──────────────────────────────────────────
  # Kept as its own job (not in the prek 'checks' job) so a CVE advisory failure
  # is easy to spot and doesn't block the faster lint/type feedback.
  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install deps
        run: uv sync --extra dev

      - name: pip-audit — dependency CVEs
        run: uv run pip-audit --skip-editable

  # ── 3b. Detect whether this diff needs the TUI test tier ────────────────────
  # The `tui` marker (pytest.ini_options.markers) covers 462 Textual-pilot
  # tests that are 9% of the suite but 78% of its runtime (~380s of ~488s
  # measured call time). ster/tui and ster/nav import nearly all of
  # ster/core, ster/store, ster/operations, ster/plugins and friends, so a
  # "run TUI tests only if ster/tui/** changed" rule would silently drop
  # coverage for most Python changes. Instead this only SKIPS the tier when
  # every changed file is provably outside what the TUI can ever import:
  # browser JS/assets, the browser extension, and docs — anything else runs
  # it. On push (merge to main) this always runs full, unconditionally, since
  # that's also the input to Sonar and the release gate.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      run_tui: ${{ steps.filter.outputs.run_tui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_tui=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          if [ -z "$CHANGED" ]; then
            echo "run_tui=false" >> "$GITHUB_OUTPUT"
          elif echo "$CHANGED" | grep -qvE '^(ster/assets/|kai-extension/|docs/|\.github/|.*\.(md|txt)$|README|LICENSE)'; then
            # at least one changed file is outside the safe-skip list
            echo "run_tui=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tui=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 4. Tests + coverage ──────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [changes]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      # Node lets the JS-validating tests (node --check on graph_app.js) run
      # instead of skipping.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install deps
        run: uv sync --extra dev

      - name: Run tests with coverage
        # -n auto: parallel across the runner's cores (safe now that SPARQL
        # parsing is serialised — sparql_query._SPARQL_LOCK).
        # COVERAGE_CORE=sysmon uses Python 3.12+'s low-overhead sys.monitoring
        # backend — every version in the matrix has it.
        # RUN_TUI=false (see the 'changes' job): this PR's diff is provably
        # confined to paths the TUI can't reach, so skip the 462 Textual-pilot
        # tests (78% of runtime) — diff-cover below only checks coverage of
        # the changed lines, which by construction aren't in ster/tui|nav, so
        # this can't hide a real patch-coverage gap.
        env:
          COVERAGE_CORE: sysmon
          RUN_TUI: ${{ needs.changes.outputs.run_tui }}
        run: |
          if [ "$RUN_TUI" = "false" ]; then
            uv run pytest --tb=short -q -n auto -m "not tui" --cov=. --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml
          else
            uv run pytest --tb=short -q -n auto --cov=. --cov-report=xml --cov-report=term-missing --junitxml=pytest-report.xml
          fi

      - name: 📤 Archive coverage reports
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage.xml
            pytest-report.xml

      - name: Patch coverage — changed lines must be ≥ 90% covered
        # Diff-aware: only on PRs, once (latest Python).
        # The 90% floor applies to every module — the curses-era exclusions
        # (viewer.py / ai_model_picker.py) went away with those files.
        if: matrix.python-version == '3.13' && github.event_name == 'pull_request'
        run: >
          uv run diff-cover coverage.xml
          --compare-branch "origin/${{ github.base_ref }}"
          --fail-under 90

      - name: Upload coverage to Codecov
        # Upload only once (latest Python) to avoid duplicate reports
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: coverage.xml
          fail_ci_if_error: false   # don't break CI if Codecov is unreachable
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── 4b. SonarQube Scan ───────────────────────────────────────────────────────
  # Runs after tests are complete to collect coverage reports.
  #
  # The self-hosted runners belong to the internal adeo org. The public mirror
  # (gbelbe/ster) has none registered, so without the repository guard this job
  # queues until GitHub kills it at the 24h ceiling and reds the whole run.
  sonar:
    name: "📡 Code Quality: Sonar push"
    needs: [test]
    if: github.repository == 'adeo/kai-ster'
    runs-on: [self-hosted, Linux, standard]
    # Fail in minutes, not a day, if no self-hosted runner picks this up.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: 🛠️ Install project
        run: uv sync --extra dev

      - name: 📥 Download coverage reports
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
          path: .

      - name: "📡 Code Quality: Sonar push"
        uses: adeo/sonarqube--scan-action@0bdf2411a72513d05f1582d1c896de6d3cfce878 # v2.5.1

  # ── 5. Create the GitHub Release for a fresh tag ────────────────────────────
  # release-tag.yml already tagged this commit if it earned a release. Creating
  # the GitHub Release from that tag is what triggers publish.yml — the sole
  # path to PyPI since "ci: let the commit log decide the version" (#156): a
  # routine merge tags but does not publish; publishing needs this Release (or
  # a manual dispatch of publish.yml).
  release:
    name: Create GitHub release
    needs: [checks, js, security, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write   # required to create GitHub releases

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history needed for --generate-notes and for the tag

      - name: Create the release if this commit is freshly tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(git describe --tags --exact-match --match 'v*' 2>/dev/null)" || {
            echo "HEAD is not on a release tag — nothing to release this run." >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Release skipped::HEAD is not on a release tag."
            exit 0
          }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice title=Release skipped::$TAG already has a GitHub release."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes
          echo "::notice title=Release created::$TAG (triggers publish.yml)."
