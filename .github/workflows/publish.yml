name: Publish to PyPI

# Trigger: publishing a GitHub Release, or running this workflow by hand.
#
# Deliberately NOT every v* tag. release-tag.yml now cuts a tag on every merge to
# main that earned one, and a routine merge must not ship to PyPI by itself.
# Tagging is automatic; releasing stays a decision someone makes.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build sdist and wheel
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publisher — configure once on pypi.org, no token secret needed
    environment:
      name: pypi
      url: https://pypi.org/p/ster
    permissions:
      id-token: write  # required for OIDC

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A release may be re-published, or dispatched by hand for a version
          # PyPI already holds. Skip, don't fail.
          skip-existing: true
