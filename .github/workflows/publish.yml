name: Publish to PyPI

# Trigger: publishing a GitHub Release, or running this workflow by hand.
#
# Deliberately NOT every v* tag. release-tag.yml now cuts a tag on every merge to
# main that earned one, and a routine merge must not ship to PyPI by itself.
# Tagging is automatic; releasing stays a decision someone makes.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Build sdist and wheel
        run: uv build

      - name: Store distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    # Trusted Publisher — configure once on pypi.org, no token secret needed
    environment:
      name: pypi
      url: https://pypi.org/p/ster
    permissions:
      id-token: write  # required for OIDC

    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # A release may be re-published, or dispatched by hand for a version
          # PyPI already holds. Skip, don't fail.
          skip-existing: true
