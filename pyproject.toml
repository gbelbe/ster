[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name = "ster"
version = "0.9.7"
description = "Terminal tool for building and exploring SKOS taxonomies and OWL ontologies"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# ── Core runtime dependencies ─────────────────────────────────────────────────
#
#   rdflib   — RDF parsing / serialisation (.ttl, .rdf, .jsonld)
#   typer    — CLI framework  (the [all] extra pulls in rich + shellingham)
#   rich     — terminal rendering: colours, tables, prompts
#   fastapi  — graph/publish server (Version & Publish LD opens live web pages)
#   pylode   — HTML documentation export (VocPub / OntPub profiles)
#   llm      — LLM-powered concept suggestions (online & offline models)
#
dependencies = [
    "rdflib>=7.0",
    "typer>=0.12",
    "rich>=13.0",
    "textual[syntax]>=0.80",      # modern TUI (New-TUI tree browser); [syntax] = TextArea Markdown highlighting
    "idna>=3.15",
    "fastapi[standard]>=0.110",   # includes uvicorn[standard]
    "watchfiles>=0.21",           # file-change watcher for live push
    "pylode>=3.0",                # HTML export
    "llm>=0.19",                  # AI assist
    "msgpack>=1.2.1",             # pin away from GHSA-6v7p-g79w-8964
    "pydantic-settings>=2.14.2",  # pin away from GHSA-4xgf-cpjx-pc3j
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
]

# ── Optional dependency groups ────────────────────────────────────────────────
#
#   The former html / ai / api extras are now part of the core dependencies
#   above, so a plain `pip install ster` (or `uv tool install ster`) ships the
#   HTML export, AI assist, and graph/publish server out of the box.
#
#   dev   — test suite + all linting / security tools (mirrors CI)
#             install:  pip install "ster[dev]"
#
#   all   — everything (kept as an alias of dev for backwards compatibility)
#             install:  pip install "ster[all]"
#
[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.0",
    "httpx>=0.27",            # FastAPI TestClient transport
    "pytest-asyncio>=0.23",   # async SSE broadcaster tests
    "pytest-xdist>=3.5",      # parallel test execution (-n auto)
    # Linting & formatting
    "ruff>=0.4",
    # Type checking
    "mypy>=1.10",
    # Security — CVE scanning
    "pip-audit>=2.7",
    # Complexity ratchet (scripts/check_complexity_ratchet.py)
    "radon>=6.0",
    # Patch-coverage gate (CI + scripts/ci.sh)
    "diff-cover>=9.0",
    # Architecture / dependency-isolation contracts
    "import-linter>=2.0",
    # Templates / YAML
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    # TUI snapshot testing (textual itself is a core dependency)
    "pytest-textual-snapshot>=1.0",
    # The Semantic Lint plugin is optional at runtime, but its checks are tested.
    "semanticlint>=0.5.0",
]
# Optional: the Semantic Lint plugin's dependency. Owned by the plugin, not core —
# install with `ster[semanticlint]` (or activate the plugin in-app to install it).
semanticlint = [
    "semanticlint>=0.5.0",
]
all = [
    "ster[dev]",
    "ster[semanticlint]",
]

# ── Entry points ──────────────────────────────────────────────────────────────

[project.scripts]
ster = "ster.cli:main"

# ── Project URLs ──────────────────────────────────────────────────────────────

[project.urls]
Homepage   = "https://github.com/gbelbe/ster"
Repository = "https://github.com/gbelbe/ster"
Issues     = "https://github.com/gbelbe/ster/issues"

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "--tb=short --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: end-to-end test that exercises real I/O (deselect with -m 'not integration')",
]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source   = ["ster"]
omit     = ["ster/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
# Docs: https://docs.astral.sh/ruff/

[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names…)
    "I",   # isort (import order)
    "UP",  # pyupgrade (modernise syntax)
    "B",   # flake8-bugbear (likely bugs / design issues)
    "C4",  # flake8-comprehensions (cleaner list/dict/set comprehensions)
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (security SAST — replaces standalone bandit)
    "C90", # mccabe complexity (C901 hard ceiling; diff-aware ratchet via scripts/)
]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "E701",   # multiple statements on one line (compact TUI rendering style)
    "E702",   # statement ends with semicolon (same)
    "E741",   # ambiguous variable name — 'l','b','e' used in readline API callbacks
    "E402",   # module-level import not at top — lazy imports are intentional
    "B008",   # function call in argument default — Typer CLI pattern
    "B904",   # raise without 'from' in except — Typer Exit(1) pattern
    "SIM105", # use contextlib.suppress — intentional try/except/pass in curses rendering
    "SIM108", # ternary operator — sometimes less readable
    "UP042",  # use StrEnum — (str, Enum) kept for broader Python compatibility
    # S — security (ruff-bandit): project-specific false positives mirroring old bandit skips
    "S101",   # assert — used for type-narrowing, not security-critical (mirrors bandit B101)
    "S110",   # try/except/pass — intentional fallback pattern (curses, optional deps)
    "S310",   # urllib.urlopen — URL is constructed internally, not from user input
    "S603",   # subprocess without shell=True — called with controlled, non-user-supplied args
    "S607",   # subprocess partial path — pip/pylode/git are trusted system tools
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S105",  # hardcoded passwords in test fixtures (token strings are not real secrets)
    "S106",  # hardcoded password as argument — same as S105
    "S108",  # /tmp paths in tests are intentional; no sensitive data involved
]

[tool.ruff.lint.mccabe]
# Safety-net ceiling: C901 only fires on functions that are truly extreme
# (essentially unreviewable). Day-to-day enforcement — ≤10 target, ≤25
# hard ceiling on touched functions — is handled by the diff-aware ratchet
# in scripts/check_complexity_ratchet.py (HARD_CEILING = 25).
max-complexity = 200

# ── Mypy (type checker) ───────────────────────────────────────────────────────
# Docs: https://mypy.readthedocs.io/

[tool.mypy]
python_version        = "3.11"
ignore_missing_imports = true   # external libs without stubs (rdflib, pylode…)
warn_return_any       = false   # too noisy for progressive adoption
warn_unused_ignores   = false   # some ignores are version-dependent
pretty                = true

# ── Import contracts (import-linter) — dependency isolation ───────────────────
# Each heavy third-party library may be imported by exactly one adapter module,
# so an upgrade or swap touches one file. See CLAUDE.md "External dependencies".
# Run locally with: uv run lint-imports

[tool.importlinter]
root_package = "ster"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "pyLODE only via ster.html_export"
type = "forbidden"
source_modules = ["ster"]
forbidden_modules = ["pylode"]
ignore_imports = ["ster.html_export -> pylode"]

[[tool.importlinter.contracts]]
name = "llm only via ster.ai"
type = "forbidden"
source_modules = ["ster"]
forbidden_modules = ["llm"]
ignore_imports = ["ster.ai -> llm"]

[[tool.importlinter.contracts]]
name = "semanticlint only via the semanticlint plugin"
type = "forbidden"
source_modules = ["ster"]
forbidden_modules = ["semanticlint"]
# The plugin's runner/checks are the sole runtime gateway; git.manager's edge is a
# TYPE_CHECKING-only import of Severity/Violation (no runtime dependency).
ignore_imports = [
    "ster.plugins.semanticlint.runner -> semanticlint",
    "ster.plugins.semanticlint.checks -> semanticlint",
    "ster.plugins.semanticlint.config -> semanticlint",
    "ster.git.manager -> semanticlint",
]

[[tool.importlinter.contracts]]
name = "fastapi only via ster.api"
type = "forbidden"
source_modules = ["ster"]
forbidden_modules = ["fastapi"]
ignore_imports = ["ster.api -> fastapi"]

# ── Layering (core-service refactor) ─────────────────────────────────────────
# The application core stays front-end agnostic; the domain stays below the core.
# See docs/architecture/module-layout.md.

[[tool.importlinter.contracts]]
name = "core is front-end agnostic"
type = "forbidden"
source_modules = ["ster.core"]
forbidden_modules = ["ster.nav", "ster.cli", "ster.api"]

[[tool.importlinter.contracts]]
name = "domain does not depend on the core"
type = "forbidden"
source_modules = ["ster.operations", "ster.domain"]
forbidden_modules = ["ster.core"]

# The domain leaf layers (skos / owl / onto) stay independent of one another;
# only the cross dispatcher may reach into skos + owl. See module-layout.md.
[[tool.importlinter.contracts]]
name = "domain leaf layers are independent"
type = "independence"
modules = ["ster.domain.skos", "ster.domain.owl", "ster.domain.onto"]

[[tool.importlinter.contracts]]
name = "domain leaf layers do not import the cross dispatcher"
type = "forbidden"
source_modules = ["ster.domain.skos", "ster.domain.owl", "ster.domain.onto"]
forbidden_modules = ["ster.domain.cross"]
