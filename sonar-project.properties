# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/analysis-parameters

# SonarQube project identity used by Connected Mode and CI analysis.
sonar.projectKey=github:1256160865

# Source information
sonar.sourceEncoding=UTF-8
sonar.sources=ster,kai-extension,semanticdiff
sonar.tests=tests

# Exclusions
# On n'exclut plus tests/** car on veut qu'ils soient indexés comme tests
sonar.exclusions=

# Coverage configuration
# ster/assets/** and kai-extension/** are browser JavaScript. There is no JS test
# runner here (sonar.javascript.lcov.reportPaths below stays commented out), so
# every line of them counts as uncovered new code and sinks the new-code coverage
# gate on any PR that touches the graph app. Their behaviour is asserted from
# Python, in tests/unit/test_graph_detail_panel.py and test_concept_explore.py.
sonar.coverage.exclusions=tests/**,scripts/**,ster/assets/**,kai-extension/**

# Python
# https://docs.sonarsource.com/sonarqube/10.4/analyzing-source-code/languages/python/
# Liste explicite des versions supportées pour éviter l'interpolation non supportée
sonar.python.version=3.12, 3.13

# Reports
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/test-coverage/overview
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml
sonar.python.xunit.skipDetails=true

# JavaScript / TypeScript
# https://docs.sonarsource.com/sonarqube/latest/analyzing-source-code/test-coverage/javascript-typescript-test-coverage/
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
