# The actual catalog data — edit this, not CRAFTSMANSHIP.md's tables
# directly (those are generated: scripts/render_catalog.py). See README's
# "How to add a new heuristic / rule."
#
# kind: tidying (Beck, structural-only, existing code)
#       smell-fix (Fowler, existing or new code)
#       principle (Martin/Beck-XP, new-code design, not a commit type)
#       workflow (Feathers, legacy-code prerequisite)
#
# `id` is the tidy(<id>): commit-type slug for kind in {tidying, smell-fix}.
# `code` is a stable CGnnn identifier (scripts/craftcov.py, reports, cross-
# referencing) — sequential by first appearance, never renumbered or reused
# once assigned, even if an entry is later removed.
#
# `detector` (optional) wires an entry to scripts/craftcov.py's automatic
# scan. Present only where a real mechanical proxy exists; most entries have
# none on purpose — a false-positive-prone regex for something like Feature
# Envy would be worse than not detecting it at all. See craftcov.py's module
# docstring for the full honesty-about-limits explanation.
#   tool: ruff   rules: [<rule codes>]   — the only detector kind so far.

- id: guard-clauses
  code: CG001
  name: Guard Clauses
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Deeply nested conditionals hide the common case
  action: Replace nested conditionals with early returns
  detectors:
    - tool: ruff
      rules: [RET505]

- id: dead-code
  code: CG002
  name: Dead Code
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Code nothing calls
  action: Delete it
  detectors:
    - tool: ruff
      rules: [F401, F811, F841]
    - tool: vulture   # second, higher-recall pass: catches unused
                      # functions/classes/methods ruff's own-file-scoped
                      # checks can't see. Lower precision by nature (it
                      # reports its own confidence score per finding).

- id: normalize-symmetries
  code: CG003
  name: Normalize Symmetries
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Equivalent code expressed in different styles, hiding which differences are real
  action: Make the style consistent so real differences stand out

- id: new-interface-old-implementation
  code: CG004
  name: New Interface, Old Implementation
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: You need to change a function's calling shape
  action: Introduce the calling shape you want, delegating to the existing implementation, before touching behavior

- id: reading-order
  code: CG005
  name: Reading Order
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Declarations aren't in the order a reader needs them
  action: Reorder for the reader, not the writer

- id: cohesion-order
  code: CG006
  name: Cohesion Order
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Things that change together live far apart
  action: Put them physically together

- id: move-declaration-init
  code: CG007
  name: Move Declaration and Initialization Together
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: A variable's declaration is far from its use
  action: Relocate it next to where it's set/used

- id: explaining-variable
  code: CG008
  name: Explaining Variable
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: An expression's meaning isn't obvious
  action: Extract part of it into a well-named variable

- id: explaining-constant
  code: CG009
  name: Explaining Constant
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: A magic literal
  action: Replace it with a named constant
  detectors:
    - tool: ruff
      rules: [PLR2004]

- id: explicit-parameters
  code: CG010
  name: Explicit Parameters
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: A function reaches into shared/ambient state
  action: Turn the implicit dependency into an explicit parameter

- id: chunk-statements
  code: CG011
  name: Chunk Statements
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: An undifferentiated wall of statements
  action: Group related statements before extracting

- id: extract-helper
  code: CG012
  name: Extract Helper
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: A coherent chunk of logic embedded inline
  action: Pull it into a named function
  detectors:
    - tool: ruff
      rules: [PLR0915]

- id: one-pile
  code: CG013
  name: One Pile
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: Related elements scattered with no visible shape
  action: Temporarily collapse them to see the whole shape before re-splitting sensibly

- id: explaining-comment
  code: CG014
  name: Explaining Comment
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: The *why* isn't inferable from the code
  action: Add a comment — but only for the why, never the what

- id: delete-redundant-comment
  code: CG015
  name: Delete Redundant Comment
  kind: tidying
  source: "Kent Beck, Tidy First? (2023)"
  smell: A comment just restates the code
  action: Remove it

- id: extract-class
  code: CG016
  name: Large Class / God Class / Divergent Change
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: A class doing too much, or changing for many unrelated reasons
  action: Split it along its actual responsibilities
  # ruff's own too-many-public-methods (PLR0904) is preview-only (needs
  # --preview) and too-many-instance-attributes (PLR0902) doesn't exist in
  # ruff at all — checked as of ruff 0.16.9. Their stable originals live in
  # upstream pylint, so that's the detector, scoped to just these two rules
  # rather than a full pylint run.
  detectors:
    - tool: pylint
      rules: [R0902, R0904]

- id: move-method
  code: CG017
  name: Feature Envy / Data Class
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: A method more interested in another object's data than its own; or a class that's all data, no behavior
  action: Move the method to the data (or the behavior into the data class)

- id: introduce-parameter-object
  code: CG018
  name: Data Clumps
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: The same group of parameters travels together across call sites
  action: Give the group its own type
  detectors:
    - tool: ruff
      rules: [PLR0913]

- id: replace-primitive-with-object
  code: CG019
  name: Primitive Obsession
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: "A raw string/int stands in for a real domain concept (money, a URI, a version)"
  action: Give the concept its own type

- id: hide-delegate
  code: CG020
  name: Message Chains
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: "`a.getB().getC().getD()` reaches through several objects (Law of Demeter)"
  action: Hide the chain behind a method on the first object

- id: replace-conditional-with-polymorphism
  code: CG021
  name: Repeated Switches
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: The same type-based branching logic scattered across the codebase
  action: Replace it with dispatch (polymorphism, a strategy, a registry)
  detectors:
    - tool: ruff
      rules: [PLR0912]

- id: collapse-hierarchy
  code: CG022
  name: Speculative Generality
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: Abstraction or a hook built for a future that hasn't arrived
  action: Collapse it back to what's actually used — this is YAGNI already sitting in the code

- id: replace-inheritance-with-delegation
  code: CG023
  name: Refused Bequest
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: A subclass uses only a fraction of what it inherits
  action: Prefer composition over the ill-fitting inheritance

- id: consolidate-duplicate-conditional
  code: CG024
  name: Shotgun Surgery (conditional form)
  kind: smell-fix
  source: "Martin Fowler (with Kent Beck), Refactoring, 2nd ed. (2018)"
  smell: One logical decision is duplicated as near-identical conditionals in several places
  action: Consolidate into one decision point
  # Broader proxy than the smell's own name: the detector (a ported,
  # rolling-hash line-window match — see scripts/craftcov.py's "duplicate
  # code" section) flags any exact-duplicate block >= min_lines, not
  # specifically conditionals. Same kind of imprecision as
  # introduce-parameter-object's "too many args" proxy for the narrower
  # "same group repeats" smell — a real trade, not an oversight.
  detectors:
    - tool: dupes
      # Calibrated against real PMD CPD output on kai-ster (~670 files),
      # not borrowed from pylint's default (4) — that default flooded the
      # report with trivial matches like a bare `subprocess.run(...,
      # capture_output=True, text=True, check=False)` call, which PMD's
      # own minimum-tokens=50 (a common value in its examples) does NOT
      # flag standalone. min_lines=8 (~40-45 tokens on this codebase, ~5.2
      # tokens/line measured directly) landed closest to PMD@50's finding
      # count of the values tried. See README's craftCov section for the
      # full comparison (both tools agree on the same real duplicates;
      # only the noise floor differed).
      min_lines: 8

- id: function-does-one-thing
  code: CG025
  name: Function does one thing, stays small
  kind: principle
  source: "Robert C. Martin, Clean Code (2008)"

- id: few-arguments
  code: CG026
  name: Prefer 0-2 arguments, no flag arguments
  kind: principle
  source: "Robert C. Martin, Clean Code (2008)"

- id: command-query-separation
  code: CG027
  name: Command-Query Separation
  kind: principle
  source: "Robert C. Martin, Clean Code (2008)"

- id: solid
  code: CG028
  name: SOLID (esp. Single Responsibility, Dependency Inversion)
  kind: principle
  source: "Robert C. Martin, Agile Software Development (2002)"

- id: simple-design
  code: CG029
  name: Four rules of simple design (priority order)
  kind: principle
  source: "Kent Beck, Extreme Programming Explained (1999/2004)"

- id: metzs-rules
  code: CG030
  name: "Classes <=100 lines, methods <=5 lines, <=4 params (optional, stricter)"
  kind: principle
  source: "Sandi Metz"

- id: characterization-test
  code: CG031
  name: Characterization Test
  kind: workflow
  source: "Michael Feathers, Working Effectively with Legacy Code (2004)"
  smell: Existing code has no tests, so a structural change has nothing to confirm behavior against
  action: "Write a test pinning current (possibly buggy) behavior, commit as test(characterize):, then tidy under that safety net"

# The four below are enforced by scripts/check_complexity_ratchet.py, a
# diff-aware gate like Refactor First — not by craftcov.py (no `detectors`
# field: that key means "craftcov.py's own scan covers this," which these
# deliberately aren't part of). See CRAFTSMANSHIP.md's "The complexity
# ratchet" for the actual enforcement, and craftcov.py --list-detectors'
# own output will correctly show these as "needs judgment" from *its*
# point of view, since it genuinely doesn't scan for them.

- id: high-cyclomatic-complexity
  code: CG032
  name: High Cyclomatic Complexity
  kind: smell-fix
  source: "Thomas J. McCabe, \"A Complexity Measure\", IEEE Transactions on Software Engineering (1976)"
  smell: A function has too many independent linear paths through it to reason about or test exhaustively
  action: Extract cohesive chunks into named helpers, or replace branching with dispatch (polymorphism, a strategy, a registry)

- id: high-cognitive-complexity
  code: CG033
  name: High Cognitive Complexity
  kind: smell-fix
  source: "G. Ann Campbell, \"Cognitive Complexity\", SonarSource whitepaper (2018) — SonarQube rule S3776"
  smell: A function's nesting and branching make it hard for a human to hold its logic in mind, even when cyclomatic complexity alone looks fine
  action: Flatten nesting with guard clauses, extract nested blocks into named helpers

- id: invariant-return
  code: CG034
  name: Invariant Return
  kind: smell-fix
  source: "SonarSource, SonarQube rule S3516"
  smell: Every return in a function hands back the same never-rebound name, reading as multiple outcomes when it is really one
  action: Collapse to a single exit point, reached by break or fall-through, instead of returning the same name from several places

- id: duplicated-string-literal
  code: CG035
  name: Duplicated String Literal
  kind: smell-fix
  source: "SonarSource, SonarQube rule S1192"
  smell: The same string literal (5+ characters) is repeated 3 or more times in one file
  action: Extract it to a named constant so the values can't silently drift apart
