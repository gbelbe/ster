# Pre-commit hooks — mirrors the CI lint job so issues are caught locally.
# Install once:  pip install pre-commit && pre-commit install
# Run manually:  pre-commit run --all-files

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff              # linting
        args: [--fix]
      - id: ruff-format       # formatting

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements   # catch leftover breakpoint() / pdb calls

  # Tidy First discipline (see the tidy-first skill): the commit range must
  # contain a tidy(<type>): commit or a Tidy-Exempt: trailer. manual stage:
  # it's diff-aware and needs --base, which pre-commit/prek has no way to
  # supply per-hook — scripts/ci.sh and CI invoke it directly with a base ref.
  - repo: local
    hooks:
      - id: tidy-ratchet
        name: "tidy ratchet (tidy(<type>): commit or Tidy-Exempt: trailer)"
        entry: bash scripts/check_tidy_ratchet.sh
        language: system
        pass_filenames: false
        stages: [manual]
