# ─────────────────────────────────────────────────────────────────────────────
# Taxonomy / Ontology CI  —  generated by ster init-ci
#
# Runs on every push and pull-request that touches ontology files.
# Configure linting rules in onto-ci.yml at the project root.
# ─────────────────────────────────────────────────────────────────────────────

name: Taxonomy CI

on:
  push:
    paths:
      - "**/*.ttl"
      - "**/*.owl"
      - "**/*.rdf"
      - "**/*.n3"
      - "**/*.jsonld"
      - "onto-ci.yml"
  pull_request:
    paths:
      - "**/*.ttl"
      - "**/*.owl"
      - "**/*.rdf"
      - "**/*.n3"
      - "**/*.jsonld"
      - "onto-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── 1. semanticlint ─────────────────────────────────────────────────────────
  # Lints SKOS, OWL, RDFS and RDF files for integrity and quality.
  #
  # --fail-on controls the minimum severity that fails CI:
  #   error    — only hard errors fail  (default, good for new projects)
  #   warning  — warnings also fail     (recommended for mature projects)
  #   info     — everything fails
  #
  # Rules are configured in onto-ci.yml at the project root.
  semanticlint:
    name: semanticlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install ster (includes semanticlint)
        run: uv tool install ster

      - name: Run semanticlint
        run: semanticlint check . --fail-on error

  # ── 2. Add further tools below ───────────────────────────────────────────────
  # Example — rudof SHACL validation:
